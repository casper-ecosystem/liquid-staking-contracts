[package]
name = "liquid-staking-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = {git = "https://github.com/odradev/odra", features = [], default-features = false }
odra-modules = {git = "https://github.com/odradev/odra", features = [], default-features = false }

[dev-dependencies]
odra-test = {git = "https://github.com/odradev/odra", features = [], default-features = false }

[build-dependencies]
odra-build = {git = "https://github.com/odradev/odra", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = {git = "https://github.com/odradev/odra", features = [], default-features = false }

[[bin]]
name = "liquid_staking_contracts_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "liquid-staking-contracts_build_schema"
path = "bin/build_schema.rs"
test = false
