[workspace]
members = [
    "liquid-staking-cli",
    "liquid-staking-contracts",
]

resolver = "2"

[workspace.dependencies]
cucumber = { version = "0.21.0" }
#odra = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }
#odra-cli = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }
#odra-modules = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }
#odra-test = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }
#odra-build = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }
#odra-bdd = { git = "https://github.com/odradev/odra", branch = "release/2.1.0" }

odra = { path = "../odra/odra/odra"}
odra-cli = { path = "../odra/odra/odra-cli"}
odra-modules = { path = "../odra/odra/modules"}
odra-test = { path = "../odra/odra/odra-test"}
odra-build = { path = "../odra/odra/odra-build"}
odra-bdd = { path = "../odra/odra/odra-bdd"}

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
opt-level = "z"
strip = true

[profile.dev.package."*"]
opt-level = 3