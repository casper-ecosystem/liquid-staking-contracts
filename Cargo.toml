[workspace]
members = [
    "liquid-staking-cli",
    "liquid-staking-contracts",
]

resolver = "2"

[workspace.dependencies]
cucumber = { version = "0.21.0" }
odra = { version = "2.0.1" }
odra-cli = { version = "2.0.1" }
odra-modules = { version = "2.0.1" }
odra-test = { version = "2.0.1" }
odra-build = { version = "2.0.1" }
odra-bdd = { version = "2.0.1" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
opt-level = "z"
strip = true

[profile.dev.package."*"]
opt-level = 3